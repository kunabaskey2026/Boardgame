```yaml
name: Maven Build and Dependency Submission

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Verify Java and Maven
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # Step 4: Validate Maven project
      - name: Validate Maven Project
        run: mvn -B -e validate

      # Step 5: Build Maven application
      - name: Build Maven Project
        run: mvn -B -e clean install

      # Step 6: Generate dependency tree
      - name: Generate Maven Dependency Tree
        run: mvn -B -e dependency:tree

      # Step 7: Submit dependency snapshot
      # Only submit on push events, not pull requests
      - name: Submit Maven Dependency Graph
        if: github.event_name == 'push'
        uses: advanced-security/maven-dependency-submission-action@v5.0.0
        with:
          directory: .
          maven-args: -B -e
```

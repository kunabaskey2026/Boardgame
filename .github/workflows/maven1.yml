name: Java DevSecOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  validate:
    name: Validate Project
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Maven Project
        run: mvn validate

  compile:
    name: Compile Project
    needs: validate
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile
        run: mvn compile

  unit-test:
    name: Execute Unit Tests
    needs: compile
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        run: mvn test

  security-scan:
    name: OWASP Security Scan
    needs: unit-test
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: OWASP Dependency Check
        continue-on-error: true
        run: |
          mvn org.owasp:dependency-check-maven:check \
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  package:
    name: Build Package
    needs: security-scan
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package Application
        run: mvn package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

  post-validation:
    name: Post Validation
    needs: package
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Verify Build
        run: |
          echo "Validation Successful"
          java -version
          mvn -version

  dependency-graph:
    name: Dependency Graph Upload
    needs: post-validation
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Update Dependency Graph
        continue-on-error: true
        uses: advanced-security/maven-dependency-submission-action@v4

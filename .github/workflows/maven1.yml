name: Java CI DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 - Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3 - Validate Project
      - name: Validate Maven Project
        run: mvn validate

      # Step 4 - Compile Source Code
      - name: Compile Application
        run: mvn compile

      # Step 5 - Run Unit Tests
      - name: Execute Unit Tests
        run: mvn test

      # Step 6 - Publish Test Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      # Step 7 - OWASP Dependency Scan
      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check

      # Step 8 - Package Application
      - name: Package Application
        run: mvn package -DskipTests

      # Step 9 - Upload Build Artifact
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

      # Step 10 - Post Validation
      - name: Post Validation Checks
        run: |
          echo "===== Java Version ====="
          java -version

          echo "===== Maven Version ====="
          mvn -version

          echo "===== Target Directory ====="
          ls -ltr target/

          echo "===== Verify Jar Exists ====="
          find target -name "*.jar"

      # Step 11 - Dependency Graph Upload
      - name: Update Dependency Graph
        uses: advanced-security/maven-dependency-submission-action@v4
        continue-on-error: true

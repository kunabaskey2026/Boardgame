name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
      # Checkout Source
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Pre Validation
      - name: Validate Maven Project
        run: mvn validate

      # Build
      - name: Build Project
        run: mvn compile

      # Test
      - name: Run Unit Tests
        run: mvn test

      # Security Check - Dependency Scan
      - name: Dependency Check
        run: mvn dependency:tree

      # Package
      - name: Package Application
        run: mvn package

      # Upload Artifact
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

      # Post Validation
      - name: Verify Build
        run: |
          ls -ltr target/
          java -version
          mvn --version

      # Dependency Graph Submission
      - name: Update Dependency Graph
        uses: advanced-security/maven-dependency-submission-action@v4
